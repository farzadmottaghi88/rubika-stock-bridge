name: TSETMC Live Collector Validation

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 9-12 * * 6,0-3"
      timezone: "Asia/Tehran"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run market engine regression tests
        run: npm test

      - name: Collect verified TSETMC snapshot
        run: node scripts/collect-tsetmc-snapshot.mjs

      - name: Save snapshot for Vercel
        shell: bash
        run: |
          cp data/live-market.json /tmp/live-market.json
          git fetch origin market-data || true

          if git show-ref --verify --quiet refs/remotes/origin/market-data; then
            git checkout -B market-data origin/market-data
            rm -rf data
          else
            git checkout --orphan market-data
            git rm -rf . || true
          fi

          mkdir -p data
          cp /tmp/live-market.json data/live-market.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-market.json

          if git diff --cached --quiet; then
            echo "Snapshot unchanged; nothing to push."
            exit 0
          fi

          git commit -m "Update live TSETMC snapshot"
          git push origin HEAD:market-data
