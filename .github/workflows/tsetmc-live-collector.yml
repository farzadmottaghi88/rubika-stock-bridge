name: TSETMC Live Collector Validation

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check TSETMC bulk endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request

          urls = [
              ("cdn_marketwatch", "https://cdn.tsetmc.com/api/ClosingPrice/GetMarketWatch?market=0&paperTypes[0]=1&paperTypes[1]=2&paperTypes[2]=3&paperTypes[3]=4&paperTypes[4]=5&paperTypes[5]=6&paperTypes[6]=7&paperTypes[7]=8&paperTypes[8]=9&showTraded=false&withBestLimits=false&hEven=0&RefID=0"),
              ("cdn_client_type_all", "https://cdn.tsetmc.com/api/ClientType/GetClientTypeAll"),
              ("cdn_daily_all", "https://cdn.tsetmc.com/api/ClosingPrice/GetClosingPriceDailyAllInst"),
              ("legacy_marketwatch", "https://old.tsetmc.com/tsev2/excel/MarketWatchPlus.aspx?d=0"),
          ]

          ua = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"

          for name, url in urls:
              started = time.time()
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": ua, "Accept": "*/*"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      body = r.read()
                      ctype = r.headers.get("content-type", "")
                      print(json.dumps({
                          "source": name,
                          "status": r.status,
                          "content_type": ctype,
                          "bytes": len(body),
                          "elapsed_ms": round((time.time()-started)*1000),
                          "prefix": body[:120].decode("utf-8", "replace")
                      }, ensure_ascii=False))
              except Exception as e:
                  print(json.dumps({
                      "source": name,
                      "status": "ERROR",
                      "elapsed_ms": round((time.time()-started)*1000),
                      "error": repr(e)
                  }, ensure_ascii=False))
          PY
