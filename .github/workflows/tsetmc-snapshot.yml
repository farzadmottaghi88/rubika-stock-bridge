name: TSETMC live snapshot

on:
  push:
    branches: [market-data]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * 6-3"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-data
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch TSETMC
        run: node scripts/fetch-tsetmc-snapshot.mjs
      - name: Commit snapshot
        run: |
          git config user.name "tsetmc-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/tsetmc-market.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update TSETMC live snapshot"
          git push origin HEAD:market-data
