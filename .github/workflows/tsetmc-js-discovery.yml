name: TSETMC API String Extraction

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Download TSETMC JavaScript
        shell: bash
        run: |
          set -e

          URL="https://www.tsetmc.com/main.f24603b0cc21e2598771.js"

          curl \
            --location \
            --silent \
            --show-error \
            --max-time 30 \
            --connect-timeout 10 \
            -A "Mozilla/5.0" \
            "$URL" \
            -o tsetmc-main.js

          echo "Downloaded:"
          wc -c tsetmc-main.js

      - name: Extract API related strings
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "TSETMC API STRING EXTRACTION"
          echo "========================================"

          python3 <<'PY'
          import re

          path = "tsetmc-main.js"

          with open(path, "rb") as f:
              data = f.read()

          text = data.decode("utf-8", errors="ignore")

          patterns = [
              r'https?://[^"\'\s]+',
              r'/api/[^"\'\s]+',
              r'api/[^"\'\s]+',
              r'cdn[^"\'\s]+',
              r'MarketWatch[^"\'\s]*',
              r'ClosingPrice[^"\'\s]*',
              r'ClientType[^"\'\s]*',
              r'Order[^"\'\s]*',
          ]

          found = set()

          for pattern in patterns:
              for match in re.findall(pattern, text, flags=re.I):
                  if len(match) < 300:
                      found.add(match)

          print("")
          print("TOTAL UNIQUE MATCHES:", len(found))
          print("")

          for item in sorted(found):
              print(item)
          PY

          echo ""
          echo "========================================"
          echo "EXTRACTION FINISHED"
          echo "========================================"
