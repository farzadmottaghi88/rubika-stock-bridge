name: TSETMC JS Range Test

on:
  workflow_dispatch:

jobs:
  test-range:
    runs-on: ubuntu-latest

    steps:
      - name: Test HTTP Range
        run: |
          URL="https://www.tsetmc.com/main.f24603b0cc21e2598771.js"

          echo "=== Testing HTTP Range ==="

          curl -L \
            -A "Mozilla/5.0" \
            --range 0-262143 \
            --max-time 20 \
            --connect-timeout 10 \
            -D headers.txt \
            -o range-test.bin \
            "$URL"

          echo ""
          echo "=== HEADERS ==="
          cat headers.txt

          echo ""
          echo "=== DOWNLOADED SIZE ==="
          wc -c range-test.bin
