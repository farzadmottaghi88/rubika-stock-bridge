name: TSETMC JS Download Test

on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Download TSETMC JavaScript
        shell: bash
        run: |
          set +e

          echo "========================================"
          echo "TSETMC JS DOWNLOAD TEST"
          echo "========================================"

          URL="https://www.tsetmc.com/main.f24603b0cc21e2598771.js"

          echo ""
          echo "URL:"
          echo "$URL"

          echo ""
          echo "Downloading..."

          curl \
            --location \
            --silent \
            --show-error \
            --max-time 30 \
            --connect-timeout 10 \
            -A "Mozilla/5.0" \
            -w "\nHTTP_STATUS:%{http_code}\nCONTENT_TYPE:%{content_type}\nSIZE:%{size_download}\nREMOTE_IP:%{remote_ip}\n" \
            "$URL" \
            -o tsetmc-main.js

          echo ""
          echo "========================================"
          echo "FILE INFORMATION"
          echo "========================================"

          if [ -f tsetmc-main.js ]; then
            ls -lh tsetmc-main.js
            wc -c tsetmc-main.js
          else
            echo "FILE_NOT_CREATED"
          fi

          echo ""
          echo "========================================"
          echo "TEST FINISHED"
          echo "========================================"
